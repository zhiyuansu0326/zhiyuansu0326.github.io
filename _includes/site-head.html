<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.title %}
<title>{{ page.title | escape }} · {{ site.title | escape }}</title>
{% else %}
<title>{{ site.title | escape }} · {{ site.affiliation | escape }}</title>
{% endif %}
<meta name="description" content="{{ site.description | escape }}">
<meta name="keywords" content="{{ site.keywords | escape }}">
<meta name="theme-color" content="#f4f4f0">

<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:description" content="{{ site.description | escape }}">
<meta property="og:image" content="{{ site.avatar | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}">
<meta name="twitter:description" content="{{ site.description | escape }}">
<meta name="twitter:image" content="{{ site.avatar | absolute_url }}">

<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ "/assets/img/favicon.ico" | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Inter+Tight:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.8.6/css/academicons.min.css" integrity="sha256-uFVgMKfistnJAfoCUQigIl+JfUaP47GrRKjf6CTPVmw=" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/pub.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/nav.css" | relative_url }}">
<script src="{{ "/assets/js/site.js" | relative_url }}" defer></script>
