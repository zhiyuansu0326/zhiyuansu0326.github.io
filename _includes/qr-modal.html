<dialog id="qr-modal" class="qr-modal" aria-labelledby="qr-modal-title">
  <div class="qr-modal-card">
    <button class="qr-modal-close" type="button" aria-label="Close QR code">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
    <div class="qr-modal-heading">
      <span>Scan to connect</span>
      <h2 id="qr-modal-title">QR Code</h2>
    </div>
    <div class="qr-modal-image-wrap">
      <img id="qr-modal-image" alt="" decoding="async">
    </div>
  </div>
</dialog>
