<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    {% include site-head.html %}
  </head>
  <body class="homepage editorial-site">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="page-progress" aria-hidden="true"><span></span></div>

    {% include site-nav.html %}
    {% include back-to-top.html %}
    {% include qr-modal.html %}

    <div class="wrapper">
      {% include profile-sidebar.html %}
      <main id="main-content" class="site-content">
        {{ content }}
      </main>
    </div>

    <footer class="site-footer">
      <span>© {{ 'now' | date: "%Y" }} {{ site.title }}</span>
      <span>Learning · Decision-making · Intelligent systems</span>
    </footer>
  </body>
</html>
